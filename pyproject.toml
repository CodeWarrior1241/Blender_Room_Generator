[project]
name = "room-gen"
version = "0.1.0"
description = "Turn a photo of a room into an editable, exportable Blender scene without paid 3D-generation APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-contrib-python-headless>=4.10",
  "pillow>=10.2",
  "pydantic>=2.6",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3",
  "transformers>=4.46",
  "huggingface_hub>=0.25",
  "safetensors>=0.4",
]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-timeout>=2.3"]
realdata = ["h5py>=3.10"]

[project.scripts]
room_gen = "room_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["room_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "blender: needs a Blender executable",
  "ml: needs the room_gen[ml] extra and cached model weights",
  "slow: long-running end-to-end tests",
  "realdata: needs the SUN RGB-D reference data in deps/sunrgbd (research use only)",
]
